name: Deploy Application (Backend & Frontend)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Install dependencies
        working-directory: ./worker-backend
        run: npm install

      - name: Deploy Worker
        working-directory: ./worker-backend
        run: |
          if [[ "${{ secrets.CF_API_TOKEN }}" == cfk_* ]]; then
            echo "Using Cloudflare Global API Key authentication..."
            export CLOUDFLARE_API_KEY="${{ secrets.CF_API_TOKEN }}"
            export CLOUDFLARE_EMAIL="Sunil.cyrixrjbemp@gmail.com"
          else
            echo "Using Cloudflare Scoped API Token authentication..."
            export CLOUDFLARE_API_TOKEN="${{ secrets.CF_API_TOKEN }}"
          fi
          npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set Worker Secrets
        working-directory: ./worker-backend
        run: |
          if [[ "${{ secrets.CF_API_TOKEN }}" == cfk_* ]]; then
            export CLOUDFLARE_API_KEY="${{ secrets.CF_API_TOKEN }}"
            export CLOUDFLARE_EMAIL="Sunil.cyrixrjbemp@gmail.com"
          else
            export CLOUDFLARE_API_TOKEN="${{ secrets.CF_API_TOKEN }}"
          fi
          echo "${{ secrets.CF_API_TOKEN }}" | npx wrangler secret put PRIMARY_CLOUDFLARE_API_TOKEN --config wrangler.toml || true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm run build
          echo "/api/* https://fieldops-api.sunilbishnoi.workers.dev/api/:splat 200" > dist/_redirects
          echo "/* /index.html 200" >> dist/_redirects
          cp public/_headers dist/_headers 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        working-directory: ./frontend
        run: |
          if [[ "${{ secrets.CF_API_TOKEN }}" == cfk_* ]]; then
            export CLOUDFLARE_API_KEY="${{ secrets.CF_API_TOKEN }}"
            export CLOUDFLARE_EMAIL="Sunil.cyrixrjbemp@gmail.com"
          else
            export CLOUDFLARE_API_TOKEN="${{ secrets.CF_API_TOKEN }}"
          fi
          npx wrangler pages deploy dist --project-name=sunil1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
